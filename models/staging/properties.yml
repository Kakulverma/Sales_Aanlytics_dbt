version: 2
models:
  - name: stg_sales
    description: "cleaned data, sales data from sales_raw."
    columns:
      - name: invoice_no
        tests: [not_null]
      - name: stock_code
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: invoice_date
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: line_amount
        description: "quantity * unit_price"
