version: 2
models:
  - name: stg_sales
    description: "cleaned data, sales data from sales_raw."
    config:
      contract:
        enforced: true
    columns:
      - name: invoice_no
        data_type: string
        tests: [not_null]
      - name: stock_code
        data_type: string
        tests: [not_null]
      - name: description
        data_type: string
      - name: quantity
        data_type: int64
        tests: [not_null]
      - name: invoice_date
        data_type: timestamp
        tests: [not_null]
      - name: unit_price
        data_type: numeric
        tests: [not_null]
      - name: country
        data_type: string
      - name: customer_id
        data_type: string
        tests: [not_null]
      - name: line_amount
        data_type: numeric
        description: "quantity * unit_price"
